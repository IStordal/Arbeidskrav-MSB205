name: Render siste utgave tekst

on:
  push:
    paths:
      - 'siste_utgave_tekst.qmd'
      - 'MSB205.bib'
      - 'hvl_apa7_stil_bokmal_v1.csl'
      - 'Data/**'
      - 'figurer_tekst/**'
      - '.github/workflows/render-term-paper.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render
        run: quarto render "siste_utgave_tekst.qmd" --to html

      - name: Verify HTML
        run: |
          test -f "siste_utgave_tekst.html"
          grep -q "Datagrunnlag og klargjøring" "siste_utgave_tekst.html"
          grep -q "Utforskende analyse i GeoDa" "siste_utgave_tekst.html"
          grep -q "Hedoniske boligprismodeller" "siste_utgave_tekst.html"
          grep -q "Romlige modeller" "siste_utgave_tekst.html"
          grep -q "Rao's Score" "siste_utgave_tekst.html"
          grep -q "Sammenligning av boligareal og inntekt" "siste_utgave_tekst.html"
          grep -q "Direkte og indirekte effekter" "siste_utgave_tekst.html"
