<style>.t{font-family:Arial,sans-serif;fill:#111}.title{font-size:30px;font-weight:700}.sub{font-size:18px;fill:#444}.h{font-size:18px;font-weight:700}.c{font-size:17px}</style>
<text x="30" y="45" class="t title">OLS-modellenes tilpasning</text>
<text x="30" y="76" class="t sub">Modell 3 har best samlet tilpasning; den største forbedringen kommer fra modell 1 til 2.</text>
