name: Export analysis data
on:
  push:
    paths:
      - '.github/workflows/export-data.yml'
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: lucas-data
          path: lucas_full.gpkg
