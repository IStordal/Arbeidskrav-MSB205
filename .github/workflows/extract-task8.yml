name: Extract task8 results

on:
  push:
    paths:
      - 'extract_task8_results.R'
      - '.github/workflows/extract-task8.yml'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install R and binary packages
        run: |
          sudo apt-get update
          sudo apt-get install -y r-base r-cran-tidyverse r-cran-lubridate r-cran-sf r-cran-spdep r-cran-spatialreg r-cran-lmtest r-cran-sandwich

      - name: Run result extraction
        run: Rscript extract_task8_results.R

      - name: Show results
        run: cat task8_results.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: task8-results
          path: task8_results.txt
