name: Extract task8 results

on:
  push:
    paths:
      - 'extract_task8_results.R'
      - '.github/workflows/extract-task8.yml'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudunits2-dev libgdal-dev libgeos-dev libproj-dev

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::lubridate
            any::sf
            any::spdep
            any::spatialreg
            any::lmtest
            any::sandwich
          cache-version: 1

      - name: Run result extraction
        run: Rscript extract_task8_results.R

      - name: Show results
        run: cat task8_results.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: task8-results
          path: task8_results.txt
