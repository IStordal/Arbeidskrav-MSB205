name: Render siste utgave tekst

on:
  push:
    paths:
      - 'siste utgave tekst.qmd'
      - 'MSB205.bib'
      - 'hvl_apa7_stil_bokmal_v1.csl'
      - 'Data/**'
      - 'figurer_tekst/**'
      - '.github/workflows/render-term-paper.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render
        run: quarto render "siste utgave tekst.qmd" --to html

      - name: Verify HTML
        run: |
          test -f "siste utgave tekst.html"
          grep -q "Datagrunnlag, klargjøring og utforskende analyse" "siste utgave tekst.html"
          grep -q "Bivariat lokal Moran" "siste utgave tekst.html"
          grep -q "Oppgave 7" "siste utgave tekst.html"
          grep -q "SAR-impacts" "siste utgave tekst.html"
