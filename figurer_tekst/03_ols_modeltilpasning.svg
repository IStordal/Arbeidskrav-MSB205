<text x="30" y="166" class="t h">Modell</text><text x="390" y="166" class="t h">Justert R²</text><text x="650" y="166" class="t h">AIC</text><text x="910" y="166" class="t h">BIC</text>
<text x="30" y="224" class="t c">Modell 1</text><text x="390" y="224" class="t c">0,731</text><text x="650" y="224" class="t c">25 015</text><text x="910" y="224" class="t c">25 772</text>
<rect x="20" y="246" width="1160" height="58" fill="#fafafa"/>
<text x="30" y="282" class="t c">Modell 2</text><text x="390" y="282" class="t c">0,829</text><text x="650" y="282" class="t c">13 490</text><text x="910" y="282" class="t c">14 336</text>
<text x="30" y="340" class="t c">Modell 3</text><text x="390" y="340" class="t c">0,832</text><text x="650" y="340" class="t c">13 060</text><text x="910" y="340" class="t c">13 956</text>
